<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kynga - Démarrer une session</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .navbar { background: #1a1a1a !important; }
        .navbar-brand { font-weight: bold; font-size: 1.5rem; }
        .card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 10px; }
        .btn-primary { background: #667eea; border: none; }
        .btn-primary:hover { background: #5568d3; }
        .exercise-card { background: white; border-left: 4px solid #667eea; margin-bottom: 15px; padding: 15px; border-radius: 5px; }
        .goal-input { max-width: 150px; }
        .progress-status { font-weight: bold; }
        .status-success { color: #28a745; }
        .status-fail { color: #dc3545; }
        .timer { font-size: 3rem; text-align: center; padding: 20px; background: #f8f9fa; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">💪 Kynga Training</span>
            <div>
                <span id="username" class="text-light me-3"></span>
                <button class="btn btn-outline-light" onclick="logout()">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <!-- Page: Dashboard -->
        <div id="dashboard" class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="text-white mb-4">Tableau de bord</h1>
                
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title">🏋️</h5>
                                <h6>Démarrer une session</h6>
                                <button class="btn btn-sm btn-primary" onclick="goToStartSession()">Commencer</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title">📊</h5>
                                <h6>Statistiques</h6>
                                <button class="btn btn-sm btn-info" onclick="goToStats()">Voir</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title">📈</h5>
                                <h6>Historique</h6>
                                <button class="btn btn-sm btn-success" onclick="goToHistory()">Consulter</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page: Start Session -->
        <div id="startSessionPage" style="display:none;" class="row justify-content-center">
            <div class="col-md-8">
                <button class="btn btn-secondary mb-3" onclick="goToDashboard()">← Retour</button>
                <h2 class="text-white mb-4">Démarrer une session</h2>
                
                <div class="card mb-4">
                    <div class="card-body">
                        <label class="form-label"><strong>Choisir une session</strong></label>
                        <select class="form-control mb-3" id="sessionSelect" onchange="loadSession()">
                            <option value="">-- Sélectionner une session --</option>
                        </select>

                        <div id="sessionExercises"></div>

                        <button class="btn btn-success w-100 mt-3" onclick="startSession()" style="display:none;" id="startBtn">
                            ▶ Commencer la session
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page: In Session -->
        <div id="inSessionPage" style="display:none;" class="row justify-content-center">
            <div class="col-md-10">
                <h2 class="text-white mb-4" id="sessionTitle"></h2>

                <div class="card mb-4">
                    <div class="card-body">
                        <div id="currentExerciseInfo"></div>

                        <hr>

                        <h5>Enregistrer votre performance</h5>
                        <div class="row">
                            <div class="col-md-3">
                                <label>Poids (kg)</label>
                                <input type="number" class="form-control" id="resultWeight" placeholder="0">
                            </div>
                            <div class="col-md-3">
                                <label>Répétitions</label>
                                <input type="number" class="form-control" id="resultReps" placeholder="0">
                            </div>
                            <div class="col-md-3">
                                <label>Séries</label>
                                <input type="number" class="form-control" id="resultSets" placeholder="0">
                            </div>
                            <div class="col-md-3">
                                <label>Temps (min)</label>
                                <input type="number" class="form-control" id="resultTime" placeholder="0">
                            </div>
                        </div>

                        <div class="mt-3">
                            <label>Notes</label>
                            <textarea class="form-control" id="resultNotes" rows="2" placeholder="Comment vous vous sentiez..."></textarea>
                        </div>

                        <button class="btn btn-primary w-100 mt-3" onclick="recordResult()">Enregistrer</button>
                    </div>
                </div>

                <!-- Rest Timer -->
                <div id="timerContainer" style="display:none;" class="card bg-light">
                    <div class="card-body">
                        <h5>⏱️ Temps de repos</h5>
                        <div class="timer" id="timerDisplay">02:00</div>
                        <div class="text-center mt-3">
                            <button class="btn btn-sm btn-secondary" onclick="skipTimer()">Sauter</button>
                            <button class="btn btn-sm btn-success" onclick="nextExercise()">Exercice suivant</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page: Stats -->
        <div id="statsPage" style="display:none;" class="row justify-content-center">
            <div class="col-md-8">
                <button class="btn btn-secondary mb-3" onclick="goToDashboard()">← Retour</button>
                <h2 class="text-white mb-4">Mes statistiques</h2>
                
                <div id="statsContainer"></div>
            </div>
        </div>

        <!-- Page: History -->
        <div id="historyPage" style="display:none;" class="row justify-content-center">
            <div class="col-md-8">
                <button class="btn btn-secondary mb-3" onclick="goToDashboard()">← Retour</button>
                <h2 class="text-white mb-4">Historique</h2>
                
                <label class="form-label text-white"><strong>Sélectionner un exercice</strong></label>
                <select class="form-control mb-3" id="exerciseSelect" onchange="loadExerciseHistory()">
                    <option value="">-- Choisir un exercice --</option>
                </select>
                
                <div id="historyContainer"></div>
            </div>
        </div>
    </div>

    <script src="training-app.js"></script>
</body>
</html>
